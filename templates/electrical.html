{% extends "base.html" %}

{% block content %}

<h2>ELECTRICAL SYSTEM</h2>

<form method="POST">
    <p>Enter activation sequence:</p>
    <input name="order">
    <button>Activate</button>
</form>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:lime">Power restored.</p>
<a href="/cafeteria">Return to Hub</a>
{% endif %}

<a href="/cafeteria">Return to Cafeteria</a>

{% endblock %}
