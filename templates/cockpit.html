{% extends "base.html" %}

{% block content %}

<h2>COCKPIT</h2>

<form method="POST">
    <p>Final system override:</p>
    <input name="code">
    <button>Initiate</button>
</form>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

{% if ending %}
<h3 style="color:lime">SYSTEM OVERRIDE ACCEPTED</h3>
<p>Ending sequence unlocked...</p>
{% endif %}


<a href="/cafeteria">Return to Cafeteria</a>

{% endblock %}
